# Cross-posts new blog posts to Mastodon, Bluesky, and Threads once Coolify
# has deployed them. See src/scripts/crosspost.mjs for how new posts are found.
name: Cross-post new blog posts

on:
  push:
    branches: [main]
    paths: ["src/content/blog/**"]
  workflow_dispatch:
    inputs:
      url:
        description: "Post URL to cross-post now (leave empty to wait for the next deploy)"
        required: false
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: true

# A newer push restarts the wait, so two quick pushes don't post the same entry twice.
concurrency:
  group: crosspost
  cancel-in-progress: true

jobs:
  crosspost:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: src/scripts/crosspost.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/scripts/crosspost.mjs
        env:
          CROSSPOST_URL: ${{ inputs.url }}
          CROSSPOST_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          MASTODON_INSTANCE: ${{ vars.MASTODON_INSTANCE || secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          BLUESKY_IDENTIFIER: ${{ vars.BLUESKY_IDENTIFIER || secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
